name: iFrame
options:
  bundleIdPrefix: com.toddfaulls
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  iFrame:
    type: application
    platform: iOS
    sources:
      - path: Client
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toddfaulls.iframe
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6PB44SHJS5
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: Client/Info.plist
      properties:
        CFBundleDisplayName: iFrame
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: iFrame finds and connects to Macs running iframe-host on your network.
        NSBonjourServices:
          - _iframe._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
