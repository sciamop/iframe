name: Windows client
on:
  push:
    paths: ['Windows/**', '.github/workflows/windows.yml', 'Shared/Protocol.swift']
  pull_request:
    paths: ['Windows/**', '.github/workflows/windows.yml', 'Shared/Protocol.swift']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Windows/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:smoke
      - run: npm run dist
      - name: Verify packaged application
        run: |
          $clientTest = Start-Process -FilePath .\dist\win-unpacked\iFrame.exe -ArgumentList '--smoke-test' -WorkingDirectory (Get-Location).Path -WindowStyle Hidden -Wait -PassThru
          if ($clientTest.ExitCode -ne 0) { throw "Packaged app test failed: $($clientTest.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: iFrame-Windows-x64
          path: Windows/dist/iFrame-*-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-test-screenshots
          path: Windows/test-output/*.png
          if-no-files-found: ignore
